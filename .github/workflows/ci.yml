name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Consumers regenerate the contracts first, so the provider tests below verify the current ones.
      - name: Generate contracts
        run: |
          for service in account-service transaction-service; do
            mvn -B -f "$service/pom.xml" test -Dtest='*ConsumerPactTest' -Dsurefire.failIfNoSpecifiedTests=false
          done

      - name: Check committed contracts are up to date
        run: git diff --exit-code pacts

      # Integration tests start PostgreSQL and RabbitMQ with Testcontainers, using the runner's Docker.
      - name: Test account-service
        run: mvn -B -f account-service/pom.xml test

      - name: Test transaction-service
        run: mvn -B -f transaction-service/pom.xml test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build
