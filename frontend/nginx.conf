server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/customers {
        proxy_pass http://account-service:8081;
    }

    location /api/accounts {
        proxy_pass http://account-service:8081;
    }

    location /api/transactions {
        proxy_pass http://transaction-service:8082;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
