server:
  port: 8082

spring:
  application:
    name: transaction-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transactiondb}
    username: ${DB_USERNAME:simplebank}
    password: ${DB_PASSWORD:simplebank}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100

account-service:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
